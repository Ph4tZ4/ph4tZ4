name: Update Profile Graphs

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/generate_profile_graphs.py
      - tests/test_profile_graphs.py
      - .github/workflows/profile-graphs.yml

permissions:
  contents: write

concurrency:
  group: profile-graphs
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test chart generation
        run: python3 -m unittest discover -s tests
      - name: Generate charts from public data
        run: python3 tools/generate_profile_graphs.py
      - name: Save updated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/graphs/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: refresh profile graphs"
          git push
