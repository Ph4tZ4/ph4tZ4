<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Kittiphat Suwannasri</title>
  <desc id="desc">Full Stack Developer and Creative Technologist. A dark banner with cyan orbital geometry.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#182932" stroke-width="1"/>
    </pattern>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#70eee4"/>
      <stop offset="1" stop-color="#00a3ca"/>
    </linearGradient>
    <clipPath id="bounds"><rect width="1200" height="500" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="500" fill="#0b1219"/>
    <rect x="750" width="450" height="500" fill="url(#grid)"/>
    <path d="M56 87H1144M56 435H1144" stroke="#263640"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="56" y="56" fill="#edf4f7" font-size="18" font-weight="700" letter-spacing="4">PH4TZ4<tspan fill="#6ee7df">.</tspan></text>
      <text x="1144" y="56" text-anchor="end" fill="#a9bac4" font-size="13" letter-spacing="2">CODE / DESIGN / EXPLORE</text>
      <text x="56" y="144" fill="#6ee7df" font-size="14" letter-spacing="3">FULL STACK DEVELOPER &amp; CREATIVE TECHNOLOGIST</text>
      <text x="52" y="224" fill="#f0f6fa" font-size="76" font-weight="700" letter-spacing="-3">Kittiphat</text>
      <text x="52" y="304" fill="#f0f6fa" font-size="76" font-weight="700" letter-spacing="-3">Suwannasri<tspan fill="#6ee7df">.</tspan></text>
      <text x="56" y="358" fill="#adbec9" font-size="21">Building at the intersection</text>
      <text x="56" y="388" fill="#adbec9" font-size="21">of code and creativity.</text>
      <circle cx="62" cy="465" r="4" fill="#6ee7df"/>
      <text x="78" y="470" fill="#adbec9" font-size="14" letter-spacing="1">LOEI, THAILAND</text>
      <text x="1144" y="470" text-anchor="end" fill="#adbec9" font-size="14" letter-spacing="1">WEB · AI · 3D · GAMES</text>
    </g>
    <g transform="translate(958 258)">
      <circle r="124" fill="#0e202a" stroke="#224652"/>
      <circle r="91" fill="none" stroke="#295864"/>
      <ellipse rx="170" ry="62" fill="none" stroke="url(#orb)" stroke-width="2" transform="rotate(-40)"/>
      <ellipse rx="170" ry="62" fill="none" stroke="#295864" transform="rotate(40)"/>
      <path d="M-33-36L-70 0L-33 36M33-36L70 0L33 36M17-50L-17 50" fill="none" stroke="url(#orb)" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="130" cy="-105" r="7" fill="#6ee7df"/>
      <circle cx="-130" cy="105" r="4" fill="#6ee7df"/>
    </g>
